<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelSathi - Safety Map & Navigation</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Web App Manifest & PWA Meta for Bubblewrap / PWA Builder / GitHub Pages -->
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#2E7D32">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TravelSathi">

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="../../assests/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../assests/icon-512.png">
    <link rel="apple-touch-icon" href="../../assests/apple-touch-icon.png">

    <link rel="stylesheet" href="../css/map.css">
    <link rel="stylesheet" href="../css/sos-broadcast.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://kit.fontawesome.com/4636c07b63.js"></script>

    <!-- map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('../../sw.js')
                    .catch(function (err) { console.warn('SW Error:', err); });
            });
        }
    </script>
</head>

<body>
    <div class="map-container">

        <div id="map"></div>

        <div class="search-bar">
            <form id="searchForm">
                <input type="text" id="searchInput" placeholder="Search destination...">
                <button type="submit">
                    <i class="fa-solid fa-magnifying-glass fa-lg"></i>
                </button>
            </form>
            <div id="searchResults" class="search-results" style="display: none;"></div>
        </div>

        <!-- Emergency Info Card Overlay -->
        <div id="emergencyCard" class="emergency-card" style="display: none;">
            <div class="emergency-card-header">
                <span id="emergencyCardTitle">🚔 Nearest Police Station</span>
                <button id="closeEmergencyCardBtn" class="close-card-btn">&times;</button>
            </div>
            <div class="emergency-card-body">
                <h4 id="emergencyStationName">Searching...</h4>
                <p id="emergencyDistanceText">Calculating distance...</p>
                <button id="emergencyNavigateBtn" class="emergency-nav-btn">
                    <i class="fa-solid fa-location-arrow"></i> Navigate
                </button>
            </div>
        </div>

    </div>
    <button class="floating-btn">
        <i class="fa-solid fa-location-dot"></i>
    </button>

    <!-- footer -->

    <footer>
        <nav class="bottom-nav">

            <a href="index.html" class="nav-item">
                <i class="fa-solid fa-house "></i>
                <span>Home</span>
            </a>

            <a href="map.html" class="nav-item active">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Map</span>
            </a>

            <a href="alerts.html" class="nav-item">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Alerts</span>
            </a>

        </nav>
    </footer>
    <!-- Firebase SDK Compat v10 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Leaflet & TravelSathi Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../backend/firebase-config.js"></script>
    <script src="../../backend/db.js"></script>
    <script src="../../backend/sos-broadcast.js"></script>
    <script src="../../backend/maps.js"></script>
    <script src="../../backend/page-transitions.js"></script>
</body>

</html>
